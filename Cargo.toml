[package]
name = "pokemon-team-display"
version = "1.3.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "io-std"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["fs", "cors"] }
notify = "6.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = "0.3"
tokio-stream = "0.1"
rust-embed = "8.11.0"
iroh = { version = "0.96.1", default-features = false }
iroh-tickets = "0.3.0"

[profile.release]
lto = true
codegen-units = 1
