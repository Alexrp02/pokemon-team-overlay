name: Release

on:
  push:
    branches:
      - main
    paths:
      - Cargo.toml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Needed for diff
      - name: Check if version line changed in Cargo.toml
        id: version_change
        run: |
          if git diff HEAD^ HEAD -- Cargo.toml | grep '^+version = ' > /dev/null; then
            echo "Version line changed, continuing."
          else
            echo "Version line did not change, skipping workflow."
            exit 0
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross tools (Windows)
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Archive binary
        run: |
          BIN_NAME=$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[0].name')
          mkdir -p dist
          if [[ "${{ matrix.target }}" == "x86_64-pc-windows-gnu" ]]; then
            cp target/${{ matrix.target }}/release/$BIN_NAME.exe dist/${BIN_NAME}-windows-x86_64.exe
          else
            cp target/${{ matrix.target }}/release/$BIN_NAME dist/${BIN_NAME}-linux-x86_64
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Extract version from Cargo.toml
        id: version
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Get latest release tag
        id: latest_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh release view --json tagName --jq .tagName 2>/dev/null || echo "")
          echo "tag=$TAG" >> $GITHUB_OUTPUT
      - name: Check if version already released
        if: steps.latest_release.outputs.tag == format('v{0}', steps.version.outputs.version)
        run: |
          echo "Version already released. Exiting."
          exit 0
      - name: Create release tag
        run: |
          git tag -f v${{ steps.version.outputs.version }}
          git push origin v${{ steps.version.outputs.version }} --force
      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        id: cliff
        with:
          config: cliff.toml
          args: --latest --strip header
      - name: Get most recent commit message for Cargo.toml
        id: commitmsg
        run: |
          {
            echo 'msg<<EOF'
            git log -1 --pretty=%b -- Cargo.toml
            echo 'EOF'
          } >> $GITHUB_OUTPUT
      - name: Combine release notes
        run: |
          {
            echo "## 📝 Release Summary"
            echo
            echo "${{ steps.commitmsg.outputs.msg }}"
            echo
            echo "-----"
            echo
            echo "${{ steps.cliff.outputs.content }}"
          } > RELEASE_NOTES.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ steps.version.outputs.version }}
          gh release create v$VERSION dist/* --title "v$VERSION" --notes-file RELEASE_NOTES.md
